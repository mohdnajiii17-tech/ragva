<html lang="en"><head>

<style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Sora', sans-serif;
      background-color: #020306;
      color: #e1e2ec;
      overflow: hidden;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* HUD Glow & Border Variants */
    .hud-border {
      border: 1px solid rgba(230, 115, 0, 0.35);
      box-shadow: 0 0 35px rgba(217, 101, 0, 0.12), inset 0 0 20px rgba(204, 85, 0, 0.05);
    }
    .hud-border-listening {
      border: 1px solid rgba(0, 255, 136, 0.45) !important;
      box-shadow: 0 0 35px rgba(0, 255, 136, 0.2), inset 0 0 20px rgba(0, 255, 136, 0.06) !important;
    }
    .hud-border-speaking {
      border: 1px solid rgba(255, 242, 117, 0.65) !important;
      box-shadow: 0 0 45px rgba(255, 234, 121, 0.32), inset 0 0 20px rgba(255, 249, 219, 0.12) !important;
    }

    /* Subtle Tactical Scanlines */
    .scanlines {
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.42) 50%);
      background-size: 100% 4px;
      pointer-events: none;
    }

    /* Audio Equalizer Bars */
    .wave-bar {
      transition: height 0.15s ease, background-color 0.25s ease;
      transform-origin: bottom;
    }
    .wave-animated .wb-1 { animation: eqBounce 0.62s infinite ease-in-out alternate; }
    .wave-animated .wb-2 { animation: eqBounce 0.45s infinite ease-in-out alternate 0.12s; }
    .wave-animated .wb-3 { animation: eqBounce 0.75s infinite ease-in-out alternate 0.24s; }
    .wave-animated .wb-4 { animation: eqBounce 0.52s infinite ease-in-out alternate 0.08s; }
    .wave-animated .wb-5 { animation: eqBounce 0.68s infinite ease-in-out alternate 0.18s; }

    @keyframes eqBounce {
      0% { transform: scaleY(0.25); }
      100% { transform: scaleY(1.55); }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.5); }
    ::-webkit-scrollbar-thumb { background: rgba(230,115,0,0.45); border-radius: 2px; }

    /* ============================================================ */
    /* BULLETPROOF RATIO MODES CSS: APPLIED ON #app-container */
    /* ============================================================ */
    #app-container {
      transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                  height 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                  top 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                  left 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                  right 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                  bottom 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.25s ease,
                  border-radius 0.3s ease,
                  background-color 0.3s ease;
    }

    /* MODE: FULL SCREEN */
    #app-container.mode-full {
      position: relative;
      width: 100vw;
      max-width: 100vw;
      height: 100vh;
      max-height: 100vh;
      top: 0; left: 0; right: auto; bottom: auto;
      transform: none;
      opacity: 1;
      pointer-events: auto;
      border-radius: 0px;
      border: none;
      box-shadow: none;
      background: transparent;
      padding: 1.25rem 1.5rem 0.5rem 1.5rem;
      z-index: 10;
    }

    /* MODE: 1/3 LATERAL DOCK */
    #app-container.mode-dock {
      position: fixed;
      width: 32vw;
      min-width: 380px;
      max-width: 520px;
      height: 100vh;
      max-height: 100vh;
      top: 0; right: 0; left: auto; bottom: auto;
      transform: none;
      opacity: 1;
      pointer-events: auto;
      border-radius: 0;
      border-left: 1px solid rgba(230,115,0,0.3);
      border-right: none; border-top: none; border-bottom: none;
      box-shadow: -20px 0 50px rgba(0,0,0,0.9);
      background: rgba(8, 10, 15, 0.96);
      backdrop-filter: blur(28px);
      padding: 1rem 1rem 0.5rem 1rem;
      z-index: 30;
    }

    /* MODE: FLOATING WIDGET */
    #app-container.mode-widget {
      position: fixed;
      width: 420px;
      max-width: calc(100vw - 32px);
      height: 560px;
      max-height: calc(100vh - 32px);
      bottom: 24px; right: 24px; top: auto; left: auto;
      transform: none;
      opacity: 1;
      pointer-events: auto;
      border-radius: 16px;
      border: 1px solid rgba(230,115,0,0.4);
      box-shadow: 0 25px 60px rgba(0,0,0,0.95), inset 0 0 20px rgba(230,115,0,0.06);
      background: rgba(9, 11, 17, 0.97);
      backdrop-filter: blur(28px);
      padding: 0.85rem 0.85rem 0.5rem 0.85rem;
      z-index: 40;
    }

    /* MODE: ORB BUTTON COLLAPSED */
    #app-container.mode-orb {
      opacity: 0;
      transform: scale(0.85);
      pointer-events: none;
    }

    /* CRITICAL: GUARANTEE PROMPT BAR CONTAINER IS NEVER HIDDEN IN ACTIVE CONTAINER & FLUSH TO BOTTOM */
    #prompt-panel-wrapper {
      display: flex !important;
      opacity: 1 !important;
      visibility: visible !important;
      transform: none !important;
    }
  </style>
</head>

<!-- THREE.JS ENGINE & ARCHITECTURAL RATIO CONTROL SCRIPT -->
<script>
    // --- 1. THREE.JS 3D SOLAR NEURAL CORE ---
    let scene, camera, renderer;
    let outerSwarm, innerSwarm, coronaPoints;
    let synapticLines;
    let cage1, cage2, cage3;
    let gimbalGroup;
    let neuralCoreGroup; // Master container grouping orb elements for clean centering & scaled framing
    let ringNodes = [];
    let ringMeshes = [];
    let cageMeshes = [];
    let coreSingularity, auraMesh;

    const outerNodeCount = 1750;
    const innerNodeCount = 650;
    const coronaCount = 380;

    let outerPositions, outerBase, outerColors;
    let innerPositions, innerBase, innerColors;
    let coronaPositions, coronaOrbits;

    const clock = new THREE.Clock();
    let agentState = 'idle'; // 'idle' | 'listening' | 'speaking'
    let currentScale = 1.0;
    let targetScale = 1.0;
    let wobbleIntensity = 0.12;
    let targetWobble = 0.12;

    // Idle Color: Rich solar amber/deep orange (#e67300)
    let currentColor = new THREE.Color('#e67300');

    // Mouse Parallax
    let mouseX = 0, mouseY = 0;
    let rotX = 0, rotY = 0;

    function initThree() {
      const mount = document.getElementById('threejsMount');
      const w = mount.clientWidth || window.innerWidth;
      const h = mount.clientHeight || window.innerHeight;

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1500);
      // Position camera so full orb with gimbal rings fits with generous breathing room
      camera.position.z = 245;

      neuralCoreGroup = new THREE.Group();
      // Scale group to ~0.80 ensuring complete containment without clipping
      neuralCoreGroup.scale.set(0.80, 0.80, 0.80);
      neuralCoreGroup.position.set(0, 0, 0);
      scene.add(neuralCoreGroup);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setClearColor(0x000000, 0);
      mount.innerHTML = '';
      mount.appendChild(renderer.domElement);

      // Gradient particle glow texture
      const canvas = document.createElement('canvas');
      canvas.width = 64; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      grad.addColorStop(0.25, 'rgba(255, 190, 100, 0.95)');
      grad.addColorStop(0.6, 'rgba(230, 115, 0, 0.65)');
      grad.addColorStop(0.9, 'rgba(180, 70, 0, 0.2)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 64, 64);
      const dotTex = new THREE.CanvasTexture(canvas);

      // Dual-shell Fibonacci Swarm
      outerPositions = new Float32Array(outerNodeCount * 3);
      outerBase = new Float32Array(outerNodeCount * 3);
      outerColors = new Float32Array(outerNodeCount * 3);

      const phi = Math.PI * (3 - Math.sqrt(5));
      for (let i = 0; i < outerNodeCount; i++) {
        const y = 1 - (i / (outerNodeCount - 1)) * 2;
        const rAtY = Math.sqrt(Math.max(0, 1 - y * y));
        const theta = phi * i;
        const rNoise = 58 * (1 + (Math.random() - 0.5) * 0.14);
        const x = Math.cos(theta) * rAtY * rNoise;
        const z = Math.sin(theta) * rAtY * rNoise;
        const py = y * rNoise;

        outerPositions[i * 3] = outerBase[i * 3] = x;
        outerPositions[i * 3 + 1] = outerBase[i * 3 + 1] = py;
        outerPositions[i * 3 + 2] = outerBase[i * 3 + 2] = z;

        const col = new THREE.Color('#e67300');
        outerColors[i * 3] = col.r;
        outerColors[i * 3 + 1] = col.g;
        outerColors[i * 3 + 2] = col.b;
      }

      const outerGeo = new THREE.BufferGeometry();
      outerGeo.setAttribute('position', new THREE.BufferAttribute(outerPositions, 3));
      outerGeo.setAttribute('color', new THREE.BufferAttribute(outerColors, 3));
      const outerMat = new THREE.PointsMaterial({
        size: 3.4,
        map: dotTex,
        vertexColors: true,
        transparent: true,
        opacity: 0.95,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      outerSwarm = new THREE.Points(outerGeo, outerMat);
      neuralCoreGroup.add(outerSwarm);

      // Inner Swarm
      innerPositions = new Float32Array(innerNodeCount * 3);
      innerBase = new Float32Array(innerNodeCount * 3);
      innerColors = new Float32Array(innerNodeCount * 3);
      for (let i = 0; i < innerNodeCount; i++) {
        const y = 1 - (i / (innerNodeCount - 1)) * 2;
        const rAtY = Math.sqrt(Math.max(0, 1 - y * y));
        const theta = phi * (i + 120);
        const rNoise = 34 * (1 + (Math.random() - 0.5) * 0.1);
        const x = Math.cos(theta) * rAtY * rNoise;
        const z = Math.sin(theta) * rAtY * rNoise;
        const py = y * rNoise;

        innerPositions[i * 3] = innerBase[i * 3] = x;
        innerPositions[i * 3 + 1] = innerBase[i * 3 + 1] = py;
        innerPositions[i * 3 + 2] = innerBase[i * 3 + 2] = z;

        const col = new THREE.Color('#d96500');
        innerColors[i * 3] = col.r;
        innerColors[i * 3 + 1] = col.g;
        innerColors[i * 3 + 2] = col.b;
      }
      const innerGeo = new THREE.BufferGeometry();
      innerGeo.setAttribute('position', new THREE.BufferAttribute(innerPositions, 3));
      innerGeo.setAttribute('color', new THREE.BufferAttribute(innerColors, 3));
      const innerMat = new THREE.PointsMaterial({
        size: 2.8,
        map: dotTex,
        vertexColors: true,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      innerSwarm = new THREE.Points(innerGeo, innerMat);
      neuralCoreGroup.add(innerSwarm);

      // Coronal Solar Dust
      coronaPositions = new Float32Array(coronaCount * 3);
      coronaOrbits = [];
      for (let i = 0; i < coronaCount; i++) {
        const rad = 68 + Math.random() * 26;
        const angle = Math.random() * Math.PI * 2;
        const speed = (0.004 + Math.random() * 0.008) * (Math.random() > 0.5 ? 1 : -1);
        const inclination = (Math.random() - 0.5) * 1.6;
        coronaOrbits.push({ rad, angle, speed, inclination });

        coronaPositions[i * 3] = Math.cos(angle) * rad;
        coronaPositions[i * 3 + 1] = Math.sin(angle) * Math.sin(inclination) * rad;
        coronaPositions[i * 3 + 2] = Math.sin(angle) * Math.cos(inclination) * rad;
      }
      const coronaGeo = new THREE.BufferGeometry();
      coronaGeo.setAttribute('position', new THREE.BufferAttribute(coronaPositions, 3));
      const coronaMat = new THREE.PointsMaterial({
        size: 2.2,
        color: 0xe67300,
        map: dotTex,
        transparent: true,
        opacity: 0.65,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      coronaPoints = new THREE.Points(coronaGeo, coronaMat);
      neuralCoreGroup.add(coronaPoints);

      // Synaptic Lines
      const maxLines = 1900;
      const linePositions = new Float32Array(maxLines * 6);
      const lineColors = new Float32Array(maxLines * 6);
      const lineGeo = new THREE.BufferGeometry();
      lineGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3).setUsage(THREE.DynamicDrawUsage));
      lineGeo.setAttribute('color', new THREE.BufferAttribute(lineColors, 3).setUsage(THREE.DynamicDrawUsage));
      const lineMat = new THREE.LineBasicMaterial({
        vertexColors: true,
        transparent: true,
        opacity: 0.65,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      synapticLines = new THREE.LineSegments(lineGeo, lineMat);
      neuralCoreGroup.add(synapticLines);

      // Icosahedron Wire Cages
      function makeWireCage(radius, detail, color, opacity) {
        const g = new THREE.IcosahedronGeometry(radius, detail);
        const m = new THREE.MeshBasicMaterial({
          color: color,
          wireframe: true,
          transparent: true,
          opacity: opacity,
          blending: THREE.AdditiveBlending
        });
        const mesh = new THREE.Mesh(g, m);
        cageMeshes.push(mesh);
        return mesh;
      }
      cage1 = makeWireCage(22, 2, 0xe67300, 0.45);
      cage2 = makeWireCage(28, 1, 0xd96500, 0.35);
      cage3 = makeWireCage(14, 1, 0xff8c1a, 0.55);
      neuralCoreGroup.add(cage1);
      neuralCoreGroup.add(cage2);
      neuralCoreGroup.add(cage3);

      // Singularity & Aura
      const solidCoreGeo = new THREE.SphereGeometry(9, 32, 32);
      const solidCoreMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.95,
        blending: THREE.AdditiveBlending
      });
      coreSingularity = new THREE.Mesh(solidCoreGeo, solidCoreMat);
      neuralCoreGroup.add(coreSingularity);

      const auraGeo = new THREE.SphereGeometry(15, 32, 32);
      const auraMat = new THREE.MeshBasicMaterial({
        color: 0xe67300,
        transparent: true,
        opacity: 0.45,
        blending: THREE.AdditiveBlending,
        side: THREE.BackSide
      });
      auraMesh = new THREE.Mesh(auraGeo, auraMat);
      neuralCoreGroup.add(auraMesh);

      // Revolving Astrolabe Gimbal Rings
      gimbalGroup = new THREE.Group();
      ringNodes = [];
      ringMeshes = [];

      function buildGimbalRing(radius, tube, color, opacity, tickCount, speedX, speedY, speedZ) {
        const ringPivot = new THREE.Group();
        const ringObj = new THREE.Group();
        
        const ringGeo = new THREE.TorusGeometry(radius, tube, 16, 128);
        const ringMat = new THREE.MeshBasicMaterial({
          color: color,
          transparent: true,
          opacity: opacity,
          blending: THREE.AdditiveBlending
        });
        const mainTorus = new THREE.Mesh(ringGeo, ringMat);
        ringObj.add(mainTorus);
        ringMeshes.push(mainTorus);

        if (tickCount > 0) {
          const tickGeo = new THREE.BoxGeometry(0.5, tube * 3.8, 1.4);
          const tickMat = new THREE.MeshBasicMaterial({
            color: color,
            transparent: true,
            opacity: Math.min(1.0, opacity + 0.25),
            blending: THREE.AdditiveBlending
          });
          ringMeshes.push(tickMat);
          for (let k = 0; k < tickCount; k++) {
            const angle = (k / tickCount) * Math.PI * 2;
            const tick = new THREE.Mesh(tickGeo, tickMat);
            tick.position.set(Math.cos(angle) * radius, Math.sin(angle) * radius, 0);
            tick.rotation.z = angle;
            ringObj.add(tick);
          }
        }

        ringPivot.add(ringObj);
        gimbalGroup.add(ringPivot);

        ringNodes.push({
          pivot: ringPivot,
          obj: ringObj,
          vx: speedX,
          vy: speedY,
          vz: speedZ
        });

        return ringPivot;
      }

      buildGimbalRing(76, 0.45, 0xe67300, 0.65, 16, 0.003, 0.007, 0.004);
      buildGimbalRing(77.5, 0.42, 0xd96500, 0.6, 12, -0.006, 0.004, 0.005);
      buildGimbalRing(77.5, 0.42, 0xcc5500, 0.6, 12, 0.005, -0.006, -0.003);
      buildGimbalRing(88, 0.38, 0xe67300, 0.5, 24, 0.002, 0.005, -0.006);
      buildGimbalRing(66, 0.4, 0xff8c1a, 0.55, 8, -0.004, -0.005, 0.007);

      neuralCoreGroup.add(gimbalGroup);

      // Mouse tracking
      window.addEventListener('mousemove', (e) => {
        mouseX = (e.clientX / window.innerWidth) * 2 - 1;
        mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
      });

      // Resize observer
      const ro = new ResizeObserver(() => {
        requestAnimationFrame(updateViewportSize);
      });
      ro.observe(mount);
      window.addEventListener('resize', () => requestAnimationFrame(updateViewportSize));

      animate();
    }

    function updateViewportSize() {
      const mount = document.getElementById('threejsMount');
      if (!mount || !camera || !renderer) return;
      const w = mount.clientWidth;
      const h = mount.clientHeight;
      if (w === 0 || h === 0) return;

      camera.aspect = w / h;

      if (currentWindowMode === 'dock') {
        camera.position.z = 275;
      } else if (currentWindowMode === 'widget') {
        camera.position.z = 290;
      } else {
        camera.position.z = 245;
      }

      camera.updateProjectionMatrix();
      renderer.setSize(w, h, true);
    }

    // --- 2. MULTI-HARMONIC ANIMATION LOOP ---
    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      rotY += (mouseX * 0.45 - rotY) * 0.05;
      rotX += (-mouseY * 0.45 - rotX) * 0.05;

      let targetColor;
      let pulseSpeed = 2.4;
      let targetGlowHex;
      let coreScaleMultiplier = 1.0;

      if (agentState === 'listening') {
        targetScale = 1.25;
        targetWobble = 0.42;
        targetColor = new THREE.Color('#00ff88');
        targetGlowHex = 0x00ff88;
        pulseSpeed = 4.8;
        coreScaleMultiplier = 1.2;
      } else if (agentState === 'speaking') {
        targetScale = 1.28;
        targetWobble = 1.35;
        targetColor = new THREE.Color('#fff8cc');
        targetGlowHex = 0xffea79;
        pulseSpeed = 6.2;
        coreScaleMultiplier = 1.35;
      } else {
        // Idle: Deep rich solar amber/orange
        targetScale = 1.0;
        targetWobble = 0.12;
        targetColor = new THREE.Color('#e67300');
        targetGlowHex = 0xd96500;
        pulseSpeed = 2.4;
        coreScaleMultiplier = 1.0;
      }

      currentScale += (targetScale - currentScale) * 0.08;
      wobbleIntensity += (targetWobble - wobbleIntensity) * 0.08;
      currentColor.lerp(targetColor, 0.09);

      if (outerSwarm && innerSwarm) {
        outerSwarm.rotation.y = time * 0.06 + rotY;
        outerSwarm.rotation.x = time * 0.03 + rotX;
        innerSwarm.rotation.y = -time * 0.09 + rotY;
        innerSwarm.rotation.x = -time * 0.04 + rotX;

        cage1.rotation.y += 0.014;
        cage1.rotation.x -= 0.009;
        cage2.rotation.z += 0.011;
        cage2.rotation.y -= 0.007;
        cage3.rotation.x += 0.016;

        cageMeshes.forEach((mesh) => {
          if (mesh && mesh.material) {
            mesh.material.color.lerp(currentColor, 0.1);
          }
        });

        const singPulse = (1.0 + Math.sin(time * pulseSpeed) * 0.18) * currentScale * coreScaleMultiplier;
        coreSingularity.scale.set(singPulse, singPulse, singPulse);
        if (agentState === 'speaking') {
          coreSingularity.material.color.setHex(0xffffff);
        } else if (agentState === 'listening') {
          coreSingularity.material.color.setHex(0xd0ffea);
        } else {
          coreSingularity.material.color.setHex(0xffecd0);
        }

        auraMesh.scale.set(singPulse * 1.4, singPulse * 1.4, singPulse * 1.4);
        auraMesh.material.color.set(targetGlowHex);

        if (gimbalGroup) {
          gimbalGroup.rotation.y = rotY * 0.35;
          gimbalGroup.rotation.x = rotX * 0.35;

          const ringScale = currentScale * (1.0 + Math.sin(time * 1.5) * 0.02);
          gimbalGroup.scale.set(ringScale, ringScale, ringScale);

          const speedMultiplier = (agentState === 'speaking' ? 1.6 : (agentState === 'listening' ? 1.3 : 1.0));
          ringNodes.forEach((node) => {
            node.pivot.rotation.x += node.vx * speedMultiplier;
            node.pivot.rotation.y += node.vy * speedMultiplier;
            node.pivot.rotation.z += node.vz * speedMultiplier;
          });

          ringMeshes.forEach((item) => {
            if (item.material) {
              item.material.color.lerp(currentColor, 0.09);
            } else if (item.color) {
              item.color.lerp(currentColor, 0.09);
            }
          });
        }

        const cPos = coronaPoints.geometry.attributes.position.array;
        for (let i = 0; i < coronaCount; i++) {
          const orb = coronaOrbits[i];
          orb.angle += orb.speed * (agentState === 'speaking' ? 2.4 : 1.0);
          cPos[i * 3] = Math.cos(orb.angle) * orb.rad * currentScale;
          cPos[i * 3 + 1] = Math.sin(orb.angle) * Math.sin(orb.inclination) * orb.rad * currentScale;
          cPos[i * 3 + 2] = Math.sin(orb.angle) * Math.cos(orb.inclination) * orb.rad * currentScale;
        }
        coronaPoints.geometry.attributes.position.needsUpdate = true;
        coronaPoints.material.color.lerp(currentColor, 0.08);

        const oPos = outerSwarm.geometry.attributes.position.array;
        const oCol = outerSwarm.geometry.attributes.color.array;

        const inCol = innerSwarm.geometry.attributes.color.array;
        for (let k = 0; k < innerNodeCount; k++) {
          const kIdx = k * 3;
          inCol[kIdx] += (currentColor.r - inCol[kIdx]) * 0.08;
          inCol[kIdx + 1] += (currentColor.g - inCol[kIdx + 1]) * 0.08;
          inCol[kIdx + 2] += (currentColor.b - inCol[kIdx + 2]) * 0.08;
        }
        innerSwarm.geometry.attributes.color.needsUpdate = true;

        const maxLines = 1900;
        const lineGeo = synapticLines.geometry;
        const linePos = lineGeo.attributes.position.array;
        const lineCol = lineGeo.attributes.color.array;

        let lineIdx = 0;
        let lineCount = 0;

        for (let i = 0; i < outerNodeCount; i++) {
          const idx = i * 3;
          const bx = outerBase[idx];
          const by = outerBase[idx + 1];
          const bz = outerBase[idx + 2];

          const wave1 = Math.sin(time * pulseSpeed + bx * 0.08 + by * 0.07);
          const wave2 = Math.cos(time * (pulseSpeed * 1.4) + bz * 0.09 - bx * 0.05);
          const wave3 = Math.sin(time * 3.1 + (bx + by + bz) * 0.05);
          const displacement = (wave1 * 3.6 + wave2 * 2.5 + wave3 * 1.8) * wobbleIntensity;

          const rFactor = currentScale * (1 + displacement / 58);
          oPos[idx] = bx * rFactor;
          oPos[idx + 1] = by * rFactor;
          oPos[idx + 2] = bz * rFactor;

          oCol[idx] += (currentColor.r - oCol[idx]) * 0.08;
          oCol[idx + 1] += (currentColor.g - oCol[idx + 1]) * 0.08;
          oCol[idx + 2] += (currentColor.b - oCol[idx + 2]) * 0.08;

          if (lineCount < maxLines && i % 2 === 0) {
            for (let j = i + 1; j < Math.min(i + 14, outerNodeCount); j++) {
              const jx = j * 3;
              const dx = oPos[idx] - oPos[jx];
              const dy = oPos[idx + 1] - oPos[jx + 1];
              const dz = oPos[idx + 2] - oPos[jx + 2];
              const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);

              if (dist < 18 * currentScale) {
                const alpha = 1.0 - (dist / (18 * currentScale));
                linePos[lineIdx] = oPos[idx];
                linePos[lineIdx + 1] = oPos[idx + 1];
                linePos[lineIdx + 2] = oPos[idx + 2];
                linePos[lineIdx + 3] = oPos[jx];
                linePos[lineIdx + 4] = oPos[jx + 1];
                linePos[lineIdx + 5] = oPos[jx + 2];

                const lr = oCol[idx] * alpha;
                const lg = oCol[idx + 1] * alpha;
                const lb = oCol[idx + 2] * alpha;

                lineCol[lineIdx] = lr;
                lineCol[lineIdx + 1] = lg;
                lineCol[lineIdx + 2] = lb;
                lineCol[lineIdx + 3] = lr;
                lineCol[lineIdx + 4] = lg;
                lineCol[lineIdx + 5] = lb;

                lineIdx += 6;
                lineCount++;
                if (lineCount >= maxLines) break;
              }
            }
          }
        }

        outerSwarm.geometry.attributes.position.needsUpdate = true;
        outerSwarm.geometry.attributes.color.needsUpdate = true;

        for (let k = lineIdx; k < maxLines * 6; k++) {
          linePos[k] = 0;
          lineCol[k] = 0;
        }
        lineGeo.attributes.position.needsUpdate = true;
        lineGeo.attributes.color.needsUpdate = true;
      }

      if (renderer && scene && camera) {
        renderer.render(scene, camera);
      }
    }

    // --- 3. ROBUST WINDOW RATIO SWITCHING (CLASSES ON #app-container) ---
    let currentWindowMode = 'full';

    function setWindowMode(mode) {
      currentWindowMode = mode;
      const app = document.getElementById('app-container');
      const floatingOverlay = document.getElementById('floatingOrbOverlay');
      const hintsBar = document.getElementById('promptHintsBar');
      const promptPanelWrapper = document.getElementById('prompt-panel-wrapper');
      const promptPanel = document.getElementById('prompt-panel');
      const headerTag = document.getElementById('headerTag');
      const stateBadge = document.getElementById('stateBadge');

      // Update button visual active states
      const modeKeys = [
        { id: 'btnModeFull', key: 'full' },
        { id: 'btnModeDock', key: 'dock' },
        { id: 'btnModeWidget', key: 'widget' },
        { id: 'btnModeOrb', key: 'orb' }
      ];

      modeKeys.forEach(m => {
        const btn = document.getElementById(m.id);
        if (!btn) return;
        if (m.key === mode) {
          btn.className = 'px-2 md:px-2.5 py-1 text-[10px] md:text-[11px] font-mono rounded transition-all bg-[#e67300] text-black font-semibold shadow-[0_0_12px_rgba(230,115,0,0.4)] whitespace-nowrap';
        } else {
          btn.className = 'px-2 md:px-2.5 py-1 text-[10px] md:text-[11px] font-mono rounded transition-all text-zinc-400 hover:text-[#e67300] hover:bg-amber-950/40 whitespace-nowrap';
        }
      });

      // Clear all existing mode classes from #app-container
      app.classList.remove('mode-full', 'mode-dock', 'mode-widget', 'mode-orb');
      // Apply targeted class
      app.classList.add('mode-' + mode);

      // ALWAYS enforce promptPanelWrapper visibility flush against bottom
      promptPanelWrapper.style.setProperty('display', 'flex', 'important');
      promptPanelWrapper.style.setProperty('opacity', '1', 'important');
      promptPanelWrapper.style.setProperty('visibility', 'visible', 'important');
      promptPanelWrapper.style.setProperty('transform', 'none', 'important');

      if (mode === 'full') {
        floatingOverlay.classList.add('hidden');
        if (hintsBar) hintsBar.style.display = 'flex';
        if (headerTag) headerTag.style.display = 'inline-block';
        if (stateBadge) stateBadge.style.display = 'flex';
        promptPanel.style.maxWidth = '48rem'; // max-w-3xl
        promptPanel.style.padding = '0.375rem 0.375rem 0.375rem 0.625rem';
      } else if (mode === 'dock') {
        floatingOverlay.classList.add('hidden');
        if (hintsBar) hintsBar.style.display = 'none';
        if (headerTag) headerTag.style.display = 'none';
        if (stateBadge) stateBadge.style.display = 'none';
        promptPanel.style.maxWidth = '100%';
        promptPanel.style.padding = '0.375rem 0.375rem 0.375rem 0.5rem';
      } else if (mode === 'widget') {
        floatingOverlay.classList.add('hidden');
        if (hintsBar) hintsBar.style.display = 'none';
        if (headerTag) headerTag.style.display = 'none';
        if (stateBadge) stateBadge.style.display = 'none';
        promptPanel.style.maxWidth = '100%';
        promptPanel.style.padding = '0.375rem 0.375rem 0.375rem 0.5rem';
      } else if (mode === 'orb') {
        floatingOverlay.classList.remove('hidden');
      }

      // Re-trigger viewport resizing across transitions
      window.dispatchEvent(new Event('resize'));
      [20, 80, 180, 360].forEach(delay => {
        setTimeout(() => {
          updateViewportSize();
          window.dispatchEvent(new Event('resize'));
        }, delay);
      });
    }

    // --- 4. COLOR STATE & AUDIO EQUALIZER LOGIC ---
    let isListening = false;

    function setAgentState(state) {
      agentState = state;
      const badge = document.getElementById('stateBadge');
      const dot = document.getElementById('stateDot');
      const label = document.getElementById('stateLabel');
      const micBeacon = document.getElementById('micLiveBeacon');
      const micButton = document.getElementById('micButton');
      const eq = document.getElementById('acousticEqualizer');
      const eqBars = document.querySelectorAll('#acousticEqualizer .wave-bar');
      const coreDot = document.getElementById('coreStatusDot');
      const moniker = document.getElementById('monikerText');
      const headerTag = document.getElementById('headerTag');
      const engageBtn = document.getElementById('engageBtn');
      const promptBox = document.getElementById('prompt-panel');
      const atmosphere = document.getElementById('radialAtmosphere');

      if (state === 'listening') {
        // FULL ELECTRIC NEON GREEN (#00ff88)
        if (badge) badge.className = 'hidden md:flex items-center space-x-1.5 px-2.5 py-1 rounded-full bg-emerald-950/70 border border-emerald-500/50 text-emerald-400 font-mono text-xs tracking-wider transition-all duration-300';
        if (dot) dot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-400 shadow-[0_0_10px_#00ff88] animate-ping';
        if (label) label.innerText = 'LISTENING // AUDIO ACTIVE';
        if (coreDot) coreDot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-[0_0_14px_#00ff88] animate-pulse';
        if (moniker) moniker.className = 'font-mono tracking-[0.2em] text-xs md:text-sm font-bold text-emerald-400 transition-colors duration-300';
        if (headerTag) headerTag.className = 'text-[9px] font-mono px-1.5 py-0.5 rounded bg-emerald-950/60 text-emerald-300 border border-emerald-500/40 hidden xs:inline-block transition-colors duration-300';

        if (micBeacon) micBeacon.style.opacity = '1';
        if (micButton) {
          micButton.className = 'relative p-1.5 md:p-2 rounded-lg bg-emerald-950/50 text-emerald-300 border border-emerald-500/50 transition-all duration-200 shrink-0';
        }

        if (promptBox) {
          promptBox.classList.remove('hud-border', 'hud-border-speaking');
          promptBox.classList.add('hud-border-listening');
        }
        if (engageBtn) {
          engageBtn.className = 'flex items-center space-x-1 md:space-x-1.5 px-3 md:px-4 py-1.5 md:py-2 rounded-lg bg-gradient-to-r from-emerald-400 via-teal-400 to-emerald-400 hover:brightness-110 text-black font-semibold text-xs tracking-wider transition-all duration-200 shadow-[0_0_16px_rgba(0,255,136,0.4)] shrink-0';
        }

        eq.classList.add('wave-animated');
        eqBars.forEach(bar => {
          bar.className = 'wave-bar wb-1 w-0.5 md:w-1 bg-emerald-400 rounded-full transition-colors duration-300';
        });

        if (atmosphere) atmosphere.style.background = 'radial-gradient(circle at center, rgba(0,255,136,0.12) 0%, rgba(2,3,6,0.98) 75%)';

      } else if (state === 'speaking') {
        // ULTRA-BRIGHT INCANDESCENT SUNLIGHT GOLD (#fff8cc / #ffea79)
        if (badge) badge.className = 'hidden md:flex items-center space-x-1.5 px-2.5 py-1 rounded-full bg-amber-900/60 border border-yellow-200/70 text-yellow-100 font-mono text-xs tracking-wider transition-all duration-300';
        if (dot) dot.className = 'w-1.5 h-1.5 rounded-full bg-yellow-200 shadow-[0_0_12px_#fff275] animate-ping';
        if (label) label.innerText = 'SYNTHESIZING // CELESTIAL REPLY';
        if (coreDot) coreDot.className = 'w-2.5 h-2.5 rounded-full bg-yellow-200 shadow-[0_0_16px_#ffffff] animate-pulse';
        if (moniker) moniker.className = 'font-mono tracking-[0.2em] text-xs md:text-sm font-bold text-yellow-200 transition-colors duration-300';
        if (headerTag) headerTag.className = 'text-[9px] font-mono px-1.5 py-0.5 rounded bg-amber-900/50 text-yellow-100 border border-yellow-300/50 hidden xs:inline-block transition-colors duration-300';

        if (micBeacon) micBeacon.style.opacity = '0';
        if (micButton) {
          micButton.className = 'relative p-1.5 md:p-2 rounded-lg bg-amber-950/40 text-yellow-200 border border-yellow-300/50 transition-all duration-200 shrink-0';
        }

        if (promptBox) {
          promptBox.classList.remove('hud-border', 'hud-border-listening');
          promptBox.classList.add('hud-border-speaking');
        }
        if (engageBtn) {
          engageBtn.className = 'flex items-center space-x-1 md:space-x-1.5 px-3 md:px-4 py-1.5 md:py-2 rounded-lg bg-gradient-to-r from-yellow-300 via-[#fff8cc] to-amber-200 hover:brightness-110 text-black font-semibold text-xs tracking-wider transition-all duration-200 shadow-[0_0_20px_rgba(255,242,117,0.6)] shrink-0';
        }

        eq.classList.add('wave-animated');
        eqBars.forEach(bar => {
          bar.className = 'wave-bar wb-1 w-0.5 md:w-1 bg-yellow-200 rounded-full transition-colors duration-300';
        });

        if (atmosphere) atmosphere.style.background = 'radial-gradient(circle at center, rgba(255,242,117,0.15) 0%, rgba(2,3,6,0.98) 75%)';

      } else if (state === 'thinking') {
        // NEURAL VIOLET PROCESSING STATE (#a78bfa)
        if (badge) badge.className = 'hidden md:flex items-center space-x-1.5 px-2.5 py-1 rounded-full bg-violet-950/60 border border-violet-400/50 text-violet-300 font-mono text-xs tracking-wider transition-all duration-300';
        if (dot) dot.className = 'w-1.5 h-1.5 rounded-full bg-violet-400 shadow-[0_0_10px_#a78bfa] animate-ping';
        if (label) label.innerText = 'PROCESSING // NEURAL SYNTHESIS';
        if (coreDot) coreDot.className = 'w-2.5 h-2.5 rounded-full bg-violet-400 shadow-[0_0_14px_#a78bfa] animate-pulse';
        if (moniker) moniker.className = 'font-mono tracking-[0.2em] text-xs md:text-sm font-bold text-violet-300 transition-colors duration-300';
        if (headerTag) headerTag.className = 'text-[9px] font-mono px-1.5 py-0.5 rounded bg-violet-950/60 text-violet-300 border border-violet-400/40 hidden xs:inline-block transition-colors duration-300';

        if (micBeacon) micBeacon.style.opacity = '0';
        if (micButton) {
          micButton.className = 'relative p-1.5 md:p-2 rounded-lg bg-violet-950/50 text-violet-300 border border-violet-400/50 transition-all duration-200 shrink-0';
        }

        if (promptBox) {
          promptBox.classList.remove('hud-border', 'hud-border-listening');
          promptBox.classList.add('hud-border-speaking');
        }
        if (engageBtn) {
          engageBtn.className = 'flex items-center space-x-1 md:space-x-1.5 px-3 md:px-4 py-1.5 md:py-2 rounded-lg bg-gradient-to-r from-violet-400 via-purple-400 to-violet-400 hover:brightness-110 text-black font-semibold text-xs tracking-wider transition-all duration-200 shadow-[0_0_16px_rgba(167,139,250,0.4)] shrink-0';
        }

        eq.classList.add('wave-animated');
        eqBars.forEach(bar => {
          bar.className = 'wave-bar wb-1 w-0.5 md:w-1 bg-violet-400 rounded-full transition-colors duration-300';
        });

        if (atmosphere) atmosphere.style.background = 'radial-gradient(circle at center, rgba(167,139,250,0.13) 0%, rgba(2,3,6,0.98) 75%)';

      } else {
        // IDLE: DEEP RICH SOLAR AMBER/ORANGE (#e67300, #d96500)
        if (badge) badge.className = 'hidden md:flex items-center space-x-1.5 px-2.5 py-1 rounded-full bg-amber-950/40 border border-[#e67300]/30 text-[#e67300] font-mono text-xs tracking-wider transition-all duration-300';
        if (dot) dot.className = 'w-1.5 h-1.5 rounded-full bg-[#e67300] shadow-[0_0_8px_#e67300]';
        if (label) label.innerText = 'IDLE // STANDBY';
        if (coreDot) coreDot.className = 'w-2.5 h-2.5 rounded-full bg-[#e67300] shadow-[0_0_14px_#e67300] animate-pulse';
        if (moniker) moniker.className = 'font-mono tracking-[0.2em] text-xs md:text-sm font-bold text-[#e67300] transition-colors duration-300';
        if (headerTag) headerTag.className = 'text-[9px] font-mono px-1.5 py-0.5 rounded bg-amber-950/50 text-[#e67300] border border-[#e67300]/30 hidden xs:inline-block transition-colors duration-300';

        if (micBeacon) micBeacon.style.opacity = '0';
        if (micButton) {
          micButton.className = 'relative p-1.5 md:p-2 rounded-lg bg-amber-950/40 hover:bg-[#e67300]/20 text-[#e67300] hover:text-amber-300 transition-all duration-200 border border-[#e67300]/30 shrink-0';
        }

        if (promptBox) {
          promptBox.classList.remove('hud-border-listening', 'hud-border-speaking');
          promptBox.classList.add('hud-border');
        }
        if (engageBtn) {
          engageBtn.className = 'flex items-center space-x-1 md:space-x-1.5 px-3 md:px-4 py-1.5 md:py-2 rounded-lg bg-gradient-to-r from-[#d96500] via-[#e67300] to-[#d96500] hover:brightness-110 text-black font-semibold text-xs tracking-wider transition-all duration-200 shadow-[0_0_16px_rgba(230,115,0,0.35)] shrink-0';
        }

        // STATIC AUDIO EQUALIZER IN IDLE
        eq.classList.remove('wave-animated');
        eqBars.forEach((bar, idx) => {
          const heights = ['h-1.5', 'h-2.5 md:h-3', 'h-3.5 md:h-4.5', 'h-2 md:h-2.5', 'h-1.5'];
          bar.className = `wave-bar wb-${idx+1} w-0.5 md:w-1 bg-[#e67300]/75 rounded-full ${heights[idx]} transition-colors duration-300`;
        });

        if (atmosphere) atmosphere.style.background = 'radial-gradient(circle at center, rgba(217,101,0,0.09) 0%, rgba(2,3,6,0.98) 75%)';
      }
    }

    function toggleListening() {
      // Real push-to-talk: a single press starts one real recording pass
      // (the backend auto-stops when you go quiet). Ignore re-triggers
      // while already listening/thinking/speaking.
      if (agentState === 'listening' || agentState === 'thinking' || agentState === 'speaking') return;
      setAgentState('listening');
      if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.mic_click();
      }
    }

    // KEYBOARD HOTKEYS (SPACE & ENTER)
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && document.activeElement !== document.getElementById('promptInput')) {
        e.preventDefault();
        toggleListening();
      }
      if (e.key === 'Escape') {
        if (currentWindowMode === 'orb') setWindowMode('full');
        const lModal = document.getElementById('logsModal');
        const sModal = document.getElementById('settingsModal');
        if (lModal && !lModal.classList.contains('hidden')) lModal.classList.add('hidden');
        if (sModal && !sModal.classList.contains('hidden')) sModal.classList.add('hidden');
      }
    });

    function addLog(who, text) {
      const container = document.querySelector('#logsModal .max-h-56');
      if (!container) return;
      const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit'});
      const tagColor = who === 'YOU' ? 'text-emerald-400' : 'text-[#e67300]';
      const row = document.createElement('div');
      row.className = 'flex items-start space-x-2 text-zinc-400';
      row.innerHTML = `<span class="text-zinc-600">${time}</span><span class="${tagColor}">[${who}]</span><span>${text}</span>`;
      container.appendChild(row);
      container.scrollTop = container.scrollHeight;
    }

    function sendPrompt() {
      const input = document.getElementById('promptInput');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.submit(text);
      }
    }

    function quickTest(type) {
      const input = document.getElementById('promptInput');
      input.value = type === 'diagnostics' ? 'Run comprehensive astrolabe core diagnostics' : 'Sync sub-carrier acoustic telemetry';
      sendPrompt();
    }

    // MODALS
    function toggleModal(id) {
      const modal = document.getElementById(id);
      if (modal) modal.classList.toggle('hidden');
    }

    function clearLogs() {
      const container = document.querySelector('#logsModal .max-h-56');
      if (container) container.innerHTML = '<div class="text-zinc-600 italic">Buffer purged. System nominal.</div>';
    }

    // INIT
    window.addEventListener('DOMContentLoaded', initThree);
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      setTimeout(initThree, 40);
    }
  </script>
</body></html>
